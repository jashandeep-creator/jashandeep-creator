<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img">
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="85%" cy="30%" r="50%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".6"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="290" rx="18" fill="url(#p2-bg)"/>
  <rect width="1200" height="290" rx="18" fill="url(#p2-glow)"/>
  <rect width="1200" height="290" rx="18" fill="url(#p2-grid)"/>
  <rect width="1198" height="288" x="1" y="1" rx="17" fill="none" stroke="#701A3D" stroke-width="1.5" stroke-opacity=".5"/>

  <text x="50" y="52" font-family="'Courier New', monospace" font-size="13" fill="#E5B5C7" letter-spacing="2">FEATURED PROJECT • COMPUTER VISION</text>
  <text x="50" y="100" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#F8F0F3">AIR TYPE — Touchless Virtual Keyboard</text>
  <text x="50" y="140" font-family="system-ui, sans-serif" font-size="17" fill="#B6A3AC">Virtual air-typing interface controlled purely by hand movements and finger gestures.</text>
  <text x="50" y="170" font-family="system-ui, sans-serif" font-size="15" fill="#8F7883">Utilizes webcam hand tracking to eliminate the need for a physical keyboard.</text>

  <rect x="50" y="215" width="120" height="34" rx="6" fill="#451126" stroke="#701A3D"/>
  <text x="70" y="238" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8F0F3">OpenCV</text>

  <rect x="185" y="215" width="130" height="34" rx="6" fill="#451126" stroke="#701A3D"/>
  <text x="205" y="238" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8F0F3">MediaPipe</text>

  <rect x="330" y="215" width="130" height="34" rx="6" fill="#451126" stroke="#701A3D"/>
  <text x="350" y="238" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8F0F3">JavaScript</text>
</svg>
