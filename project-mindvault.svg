<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img">
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="85%" cy="30%" r="50%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".6"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="290" rx="18" fill="url(#p1-bg)"/>
  <rect width="1200" height="290" rx="18" fill="url(#p1-glow)"/>
  <rect width="1200" height="290" rx="18" fill="url(#p1-grid)"/>
  <rect width="1198" height="288" x="1" y="1" rx="17" fill="none" stroke="#701A3D" stroke-width="1.5" stroke-opacity=".5"/>

  <text x="50" y="52" font-family="'Courier New', monospace" font-size="13" fill="#E5B5C7" letter-spacing="2">FEATURED PROJECT • LOCAL AI</text>
  <text x="50" y="100" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#F8F0F3">MindVault — Semantic Desktop Search Engine</text>
  <text x="50" y="140" font-family="system-ui, sans-serif" font-size="17" fill="#B6A3AC">Search your local files by what you remember about them instead of exact filenames.</text>
  <text x="50" y="170" font-family="system-ui, sans-serif" font-size="15" fill="#8F7883">Runs 100% offline with zero cloud dependency. Natural language document indexing.</text>

  <rect x="50" y="215" width="110" height="34" rx="6" fill="#451126" stroke="#701A3D"/>
