<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img">
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="85%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".08"/>
    </pattern>
    <linearGradient id="p1-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#E5B5C7"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E5B5C7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1600 0;1600 0" keyTimes="0;.4;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#p1-bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#p1-glow)"/>
  <rect width="1200" height="300" rx="18" fill="url(#p1-grid)"/>
  <rect width="1198" height="298" x="1" y="1" rx="17" fill="none" stroke="#701A3D" stroke-width="1.5" stroke-opacity=".6"/>

  <!-- Glowing Live Radar Beacon -->
  <circle cx="60" cy="50" r="4" fill="#E5B5C7">
    <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="50" r="10" fill="none" stroke="#E5B5C7" stroke-width="1.5">
    <animate attributeName="r" values="4;14;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="82" y="54" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#E5B5C7" letter-spacing="2">ACTIVE SYSTEM ? LOCAL AI ENGINE</text>
  <text x="60" y="105" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="url(#p1-sheen)">MindVault ? Desktop File Search Engine</text>
  <text x="60" y="148" font-family="system-ui, sans-serif" font-size="18" fill="#B6A3AC">Search files by what you actually remember. 100% private, runs offline with zero cloud latency.</text>
  <text x="60" y="180" font-family="system-ui, sans-serif" font-size="15" fill="#8F7883">Features vector semantic indexing, fast local caching, and natural language desktop queries.</text>

  <!-- Tags -->
  <rect x="60" y="225" width="120" height="36" rx="8" fill="#451126" stroke="#701A3D"/>
  <text x="88" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8F0F3">Python</text>

  <rect x="195" y="225" width="140" height="36" rx="8" fill="#451126" stroke="#701A3D"/>
  <text x="220" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8F0F3">Local AI</text>

  <rect x="350" y="225" width="130" height="36" rx="8" fill="#451126" stroke="#701A3D"/>
  <text x="375" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8F0F3">Offline</text>

  <!-- Shooting Comet Beam along bottom edge -->
  <circle r="3" fill="#F8F0F3">
    <animate attributeName="cx" values="60;1140" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="cy" values="290;290" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
