  <rect x="175" y="215" width="120" height="34" rx="6" fill="#451126" stroke="#701A3D"/>
  <text x="195" y="238" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8F0F3">Local AI</text>

  <rect x="310" y="215" width="120" height="34" rx="6" fill="#451126" stroke="#701A3D"/>
  <text x="330" y="238" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8F0F3">Offline</text>
